image: 'docker-registry.dev.concisesoftware.com/node-java:latest'

stages:
  - install
  - dependencies
  - build
  - tests

install:
  stage: install
  only:
    - merge_requests
  script:
    - rm -rf node_modules
    - yarn install
  artifacts:
    name: 'artifacts-$CI_PIPELINE_ID'
    expire_in: 30 minutes
    paths:
      - app/node_modules/

check:
  only:
    - merge_requests
  stage: dependencies
  script:
    - yarn install
    - yarn check:dependencies
  dependencies:
    - install

audit:
  only:
    - merge_requests
  stage: dependencies
  script:
    - yarn audit
  dependencies:
    - install

build:
  stage: build
  only:
    - merge_requests
  script:
    - yarn install
    - yarn build-ci
  dependencies:
    - install

lint:
  only:
    - merge_requests
  stage: tests
  script:
    - yarn install
    - yarn lint
  dependencies:
    - install

unit-test:
  only:
    - merge_requests
  stage: tests
  script:
    - yarn install
    - yarn test --coverage
  dependencies:
    - install
  artifacts:
    name: 'cov-artifact-$CI_PIPELINE_ID'
    expire_in: 1 hour
    paths:
      - ./coverage

integration-tests:
  only:
    - merge_requests
  stage: tests
  variables:
    MYSQL_DATABASE: biostasis_test
    MYSQL_ROOT_PASSWORD: rootpassw0rd
    DB_HOST: db
    DB_PASSWORD: rootpassw0rd
    DB_PORT: 3306
    DB_USERNAME: root
    NODE_ENV: test
  services:
    - name: mysql:8.0.20
      alias: db
      entrypoint:
        [
          '/entrypoint.sh',
          '--default-authentication-plugin=mysql_native_password',
        ]
  script:
    - yarn install
    - yarn test:integration
  dependencies:
    - install
